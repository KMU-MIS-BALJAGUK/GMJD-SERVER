name: CD - Deploy on PR Merge

on:
  push:
    branches: [ develop ]

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.export.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Export commit SHA
        id: export
        run: echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  build:
    needs: checkout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew clean build

  upload:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "build/libs/*.jar"
          target: ${{ secrets.APP_DIR }}

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Run Deployment
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ${{ secrets.APP_DIR }}
            mv *.jar spring-boot-application.jar
            ./run.sh

  notify-discord-cd:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()  # 성공/실패 관계없이 실행
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ needs.deploy.result }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          actor="${{ github.actor }}"
          pr_title="$PR_TITLE"
          pr_url="https://github.com/${REPO}/pull/${{ github.event.pull_request.number }}"
          action_url="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          if [ "$STATUS" = "success" ]; then
            icon="✅"
            color=3066993
            description="$icon **$actor** 님이 배포를 성공적으로 완료했습니다! 🎉
            📄 PR 제목: *${pr_title}*
            🔗 PR 링크: ${pr_url}"
          elif [ "$STATUS" = "skipped" ]; then
            icon="⏭️"
            color=8359053
            description="$icon **$actor** 님의 배포 job이 스킵되었습니다.
            🔍 워크플로 조건을 확인해주세요.
            🔗 PR 링크: ${pr_url}"
          elif [ "$STATUS" = "cancelled" ]; then
            icon="⚪"
            color=9807270
            description="$icon **$actor** 님이 배포를 취소했습니다.
            🔗 PR 링크: ${pr_url}"
          else
            icon="❌"
            color=15158332
            description="$icon **$actor** 님의 배포가 실패했습니다. ⚠️
            📄 PR 제목: *${pr_title}*
            🔗 PR 링크: ${pr_url}
            🔍 실패 단계 확인: ${action_url}"
          fi

          payload=$(jq -n \
            --arg title "🚀 배포 결과 알림" \
            --arg description "$description" \
            --argjson color "$color" \
            '{
              "embeds": [
                {
                  "title": $title,
                  "description": $description,
                  "color": $color,
                  "timestamp": (now | todateiso8601)
                }
              ]
            }')

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$payload" \
               "$DISCORD_WEBHOOK"
