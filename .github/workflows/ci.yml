name: CI - Pull Request Checks

on:
  pull_request:
    branches: [ develop ]
    types: [opened, synchronize, closed]

jobs:
  test:
    if: github.event.action == 'opened' || github.event.action == 'synchronize'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'  # 사용하려는 Gradle 버전 명시

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run Tests
        run: ./gradlew test


  notify-discord-ci:
    needs: test # test job이 끝나야 실행
    runs-on: ubuntu-latest
    if: always()  # 성공하든 실패하든
    steps:
      - name: 디스코드 알림
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          STATUS: ${{ needs.test.result }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          message="✅ CI 성공"
          color=3066993 # 초록
          if [ "$STATUS" = "skipped" ]; then
            message="⏭️ CI 스킵"
            color=8359053 # 회색
          elif [ "$STATUS" != "success" ]; then
            message="❌ CI 실패"
            color=15158332 # 빨강
          fi
          # 디스코드에 보낼 payload JSON 생성
          # actor: 작성자, message: CI 완수 메시지, pr_url: PR 링크
          pr_title="$PR_TITLE"
          payload=$(jq -n --arg actor "${{ github.actor }}" \
                          --arg message "$message" \
                          --arg pr_url "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}" \
                          --arg pr_title "$pr_title" \
                          --argjson color "$color" \
            '{
              # discord에 등록될 메시지 형태
              "embeds": [
                {
                  "title": "🏚️ PR이 생성되었습니다!",
                  "description": "\($actor)님이 PR을 만들었습니다!\n📄 \($pr_title) \n \($message)\n🔗[워크플로우 실행 확인하기](\($pr_url))",
                  "color": $color,
                  "timestamp": now | todateiso8601
                }
              ]
            }')
  
            # discord  웹훅 URL로 서버에 Post 요청
          curl  -H "Content-Type: application/json" \
                -X POST \
                -d "$payload" \
                "$DISCORD_WEBHOOK"
